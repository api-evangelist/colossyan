aid: colossyan
url: https://raw.githubusercontent.com/api-evangelist/colossyan/refs/heads/main/apis.yml
name: Colossyan
kind: company
description: Colossyan is an AI avatar and video generation platform for learning and
  development. Its REST API turns scripts into studio-quality videos with AI avatars
  and voices, lists avatars/presenters, voices and templates, supports instant avatar
  and voice clone creation, and exposes asynchronous video-generation jobs with
  webhook callbacks. API access requires a Business or Enterprise plan.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- Video Generation
- Avatars
- Text to Video
- Learning and Development
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
