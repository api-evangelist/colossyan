description: >-
  FinOps view of Colossyan spend. Colossyan bills via subscription plans
  (Free, Starter, Business, Enterprise) priced per editor seat and metered by
  monthly video minutes (NEO 1 / NEO 2), with add-ons for Studio custom
  avatars and API video-generation minutes. API access is gated to Business
  and Enterprise tiers. Cost is driven primarily by seats, video minutes
  rendered, and add-on entitlements rather than per-request token metering.
notes: >-
  Plan prices, minute allotments, and add-on terms are subject to change;
  verify against the Colossyan pricing page during reconciliation. This
  artifact is not reconciled.
