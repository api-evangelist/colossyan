meters:
- name: editor_seats
  description: Editor seats provisioned on the subscription, billed per seat per month.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: video_minutes
  description: Video minutes rendered against the plan's monthly allotment (NEO 1 / NEO 2 model tiers).
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - model
- name: instant_avatars
  description: Custom Instant avatars created, bounded per editor by plan.
  unit: avatars
  aggregation: sum
  dimensions:
  - account
  - plan
- name: studio_custom_avatars
  description: Studio custom avatar add-on, billed per year.
  unit: avatars
  aggregation: sum
  dimensions:
  - account
- name: api_minutes
  description: API video-generation minutes consumed under the API add-on / plan entitlement.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - api
- name: auto_translations
  description: Auto-translations performed against the plan's monthly allotment.
  unit: translations
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track seats, video minutes, and API minutes consumed per workspace against plan allotments.
- name: Allocation
  description: Map editor seats and API tokens to teams/cost centers; tag generated videos by project.
- name: Optimization
  description: Right-size the plan to actual minute and seat usage; reuse templates and Instant avatars to reduce re-renders; reserve NEO 2 minutes for content that needs them.
- name: Accountability
  description: Assign workspace owners; review monthly minute burn and API add-on consumption against budget.
